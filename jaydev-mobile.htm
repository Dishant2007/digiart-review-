<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --teal:      #0D9488;
    --teal-lt:   #2DD4BF;
    --teal-bg:   #E6FBF8;
    --gold:      #FFC107;
    --dark:      #08201D;
    --muted:     #5E8783;
    --surface:   #ffffff;
    --border:    rgba(13,148,136,0.15);
    --neon:      #00E5C7;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    background:
      radial-gradient(circle at 15% 20%, rgba(13,148,136,0.10), transparent 45%),
      radial-gradient(circle at 85% 80%, rgba(0,229,199,0.10), transparent 45%),
      #f0fbfa;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    position: relative;
    overflow-x: hidden;
  }

  /* ── circuit-board texture ── */
  .circuit {
    position: fixed; inset: 0;
    z-index: 0;
    opacity: 0.5;
    pointer-events: none;
    background-image:
      linear-gradient(rgba(13,148,136,0.08) 1px, transparent 1px),
      linear-gradient(90deg, rgba(13,148,136,0.08) 1px, transparent 1px);
    background-size: 42px 42px;
    -webkit-mask-image: radial-gradient(ellipse 90% 70% at 50% 40%, black 40%, transparent 85%);
            mask-image: radial-gradient(ellipse 90% 70% at 50% 40%, black 40%, transparent 85%);
  }

  /* ── floating tech emojis ── */
  .float-emoji {
    position: fixed;
    z-index: 0;
    pointer-events: none;
    opacity: 0;
    filter: drop-shadow(0 4px 10px rgba(13,148,136,0.25));
    animation: emojiFadeIn 1s ease forwards, emojiDrift ease-in-out infinite;
  }
  @keyframes emojiFadeIn { to { opacity: 0.85; } }
  @keyframes emojiDrift {
    0%, 100% { transform: translate(0,0) rotate(0deg); }
    50%      { transform: translate(-14px, 18px) rotate(8deg); }
  }
  .e1 { top: 8%;  left: 8%;  font-size: 34px; animation-delay: 0.2s, 0.2s; animation-duration: 1s, 9s; }
  .e2 { top: 14%; right: 9%; font-size: 30px; animation-delay: 0.4s, 1s;  animation-duration: 1s, 11s; }
  .e3 { bottom: 12%; left: 7%; font-size: 32px; animation-delay: 0.6s, 0.6s; animation-duration: 1s, 8s; }
  .e4 { bottom: 8%; right: 8%; font-size: 30px; animation-delay: 0.8s, 1.4s; animation-duration: 1s, 10s; }
  .e5 { top: 44%; left: 3%;  font-size: 26px; animation-delay: 1.0s, 0.3s; animation-duration: 1s, 12s; }
  .e6 { top: 40%; right: 3%; font-size: 26px; animation-delay: 1.2s, 0.9s; animation-duration: 1s, 9.5s; }

  .orb {
    position: fixed;
    border-radius: 50%;
    pointer-events: none;
    z-index: 0;
    opacity: 0;
    animation: orbFadeIn 1.2s ease forwards;
  }
  .orb-1 {
    width: 420px; height: 420px;
    background: radial-gradient(circle, rgba(0,229,199,0.22), transparent 70%);
    top: -100px; right: -100px;
    animation-name: orbFadeIn, floatOrbOne;
    animation-duration: 1.2s, 10s;
    animation-delay: 0.3s, 1.5s;
    animation-timing-function: ease, ease-in-out;
    animation-fill-mode: forwards, none;
    animation-iteration-count: 1, infinite;
    animation-direction: normal, alternate;
    filter: blur(60px);
  }
  .orb-2 {
    width: 320px; height: 320px;
    background: radial-gradient(circle, rgba(255,193,7,0.16), transparent 70%);
    bottom: -80px; left: -80px;
    animation-name: orbFadeIn, floatOrbTwo;
    animation-duration: 1.2s, 14s;
    animation-delay: 0.6s, 1.8s;
    animation-timing-function: ease, ease-in-out;
    animation-fill-mode: forwards, none;
    animation-iteration-count: 1, infinite;
    animation-direction: normal, alternate;
    filter: blur(60px);
  }
  @keyframes orbFadeIn { to { opacity: 1; } }
  @keyframes floatOrbOne {
    0%   { transform: translate(0,0) scale(1); }
    50%  { transform: translate(-40px,50px) scale(1.15); }
    100% { transform: translate(10px,20px) scale(0.9); }
  }
  @keyframes floatOrbTwo {
    0%   { transform: translate(0,0) scale(1); }
    50%  { transform: translate(50px,-40px) scale(1.2); }
    100% { transform: translate(-20px,-20px) scale(0.95); }
  }

  #starCanvas {
    position: fixed;
    inset: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 40;
  }

  .wrap {
    width: 100%;
    max-width: 420px;
    position: relative;
    z-index: 1;
  }

  .card {
    background: var(--surface);
    border-radius: 28px;
    padding: 36px 32px 30px;
    box-shadow:
      0 0 0 1px rgba(0,229,199,0.08),
      0 2px 0 rgba(13,148,136,0.08),
      0 8px 32px rgba(8,32,29,0.09),
      0 32px 64px rgba(8,32,29,0.07);
    border: 1px solid var(--border);
    opacity: 0;
    transform: translateY(32px) scale(0.96);
    animation: cardIn 0.7s cubic-bezier(.22,.8,.35,1) 0.2s both;
    position: relative;
  }
  @keyframes cardIn {
    to { opacity:1; transform: translateY(0) scale(1); }
  }

  .header { text-align: center; margin-bottom: 22px; margin-top: 4px; }
  .logo-ripple {
    position: absolute;
    top: 50%; left: 50%;
    width: 80px; height: 80px;
    margin: -40px 0 0 -40px;
    border-radius: 50%;
    border: 2px solid var(--neon);
    opacity: 0;
    animation: rippleOut 3.2s ease-out 1.4s infinite;
  }
  @keyframes rippleOut {
    0%   { transform: scale(0.6); opacity: 0.5; }
    80%  { transform: scale(2.6); opacity: 0; }
    100% { transform: scale(2.6); opacity: 0; }
  }
  .logo-img {
    width: 130px;
    height: auto;
    margin-bottom: 6px;
    opacity: 0;
    transform: translateY(-22px) scale(0.85);
    filter: drop-shadow(0 6px 16px rgba(13,148,136,0.28));
    animation: logoIn 0.7s cubic-bezier(.22,.8,.35,1) 0.25s both,
               logoFloat 3.6s ease-in-out 1.1s infinite;
  }
  @keyframes logoIn {
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes logoFloat {
    0%, 100% { transform: translateY(0) scale(1); }
    50%       { transform: translateY(-6px) scale(1.015); }
  }
  .brand-name {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 30px; font-weight: 700; letter-spacing: -0.01em;
    line-height: 1.2;
    margin-bottom: 10px;
    background: linear-gradient(135deg, var(--teal) 0%, var(--teal-lt) 60%, var(--neon) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 2px 10px rgba(13,148,136,0.25));
    opacity: 0;
    transform: translateY(-10px);
    animation: slideDown 0.6s cubic-bezier(.22,.8,.35,1) 0.4s both, glowPulse 3s ease-in-out 1.6s infinite;
  }
  @keyframes glowPulse {
    0%, 100% { filter: drop-shadow(0 2px 10px rgba(13,148,136,0.25)); }
    50%       { filter: drop-shadow(0 4px 16px rgba(0,229,199,0.45)); }
  }
  .header h1 {
    font-family: 'DM Sans', sans-serif;
    font-size: 15px; font-weight: 600; color: var(--dark);
    line-height: 1.3; margin-bottom: 5px;
    opacity: 0; transform: translateY(12px);
    animation: fadeUp 0.5s ease 0.78s both;
  }
  .header p {
    font-size: 13px; color: var(--muted);
    opacity: 0;
    animation: fadeUp 0.5s ease 0.92s both;
  }

  @keyframes slideDown {
    to { opacity:1; transform: translateY(0); }
  }
  @keyframes fadeUp {
    to { opacity:1; transform: translateY(0); }
  }

  .stars-block {
    text-align: center;
    margin: 16px 0 26px;
    opacity: 0;
    animation: fadeUp 0.5s ease 1.0s both;
  }
  .stars {
    display: flex;
    justify-content: center;
    gap: 4px;
    margin-bottom: 8px;
    position: relative;
  }

  .star {
    font-size: 44px;
    color: var(--gold);
    user-select: none;
    line-height: 1;
    filter: drop-shadow(0 2px 6px rgba(255,193,7,0.5));
    opacity: 0;
    transform: translate(-140px, -140px) rotate(-40deg) scale(0.4);
    animation: starShoot 0.55s cubic-bezier(.22,.8,.35,1) both;
    display: inline-block;
  }
  .star:nth-child(1) { animation-delay: 1.05s; }
  .star:nth-child(2) { animation-delay: 1.18s; }
  .star:nth-child(3) { animation-delay: 1.31s; }
  .star:nth-child(4) { animation-delay: 1.44s; }
  .star:nth-child(5) { animation-delay: 1.57s; }

  @keyframes starShoot {
    0%   { opacity: 0; transform: translate(-140px, -140px) rotate(-40deg) scale(0.4); }
    60%  { opacity: 1; transform: translate(4px, -6px) rotate(6deg) scale(1.15); }
    80%  { transform: translate(-3px, 3px) rotate(-4deg) scale(0.96); }
    100% { opacity: 1; transform: translate(0,0) rotate(0deg) scale(1); }
  }

  .star.landed {
    animation: starShoot 0.55s cubic-bezier(.22,.8,.35,1) both, starShimmer 2.4s ease-in-out 1.8s infinite;
  }
  @keyframes starShimmer {
    0%, 100% { filter: drop-shadow(0 2px 6px rgba(255,193,7,0.5)); transform: scale(1); }
    50%       { filter: drop-shadow(0 4px 14px rgba(255,193,7,0.85)); transform: scale(1.08); }
  }

  .stars-tag {
    display: inline-flex; align-items: center; gap: 5px;
    background: var(--teal-bg);
    color: var(--teal);
    font-size: 11px; font-weight: 600;
    padding: 4px 13px;
    border-radius: 20px;
    letter-spacing: 0.04em;
    opacity: 0;
    animation: fadeUp 0.4s ease 1.9s both;
  }
  .signal-bars { display:inline-flex; align-items:flex-end; gap:1.5px; height:9px; }
  .signal-bars span { display:block; width:2.5px; background: var(--teal); border-radius:1px; }
  .signal-bars span:nth-child(1){ height:3px; }
  .signal-bars span:nth-child(2){ height:5px; }
  .signal-bars span:nth-child(3){ height:7px; }
  .signal-bars span:nth-child(4){ height:9px; }

  .btn {
    width:100%; padding:17px; margin-top:4px;
    border:none; border-radius:16px;
    background: linear-gradient(135deg, var(--teal) 0%, var(--teal-lt) 100%);
    color:white; font-family:'Space Grotesk', sans-serif; font-size:15px; font-weight:600;
    cursor:pointer; letter-spacing:0.02em;
    transition: opacity 0.2s, transform 0.15s, box-shadow 0.2s;
    box-shadow: 0 6px 20px rgba(13,148,136,0.35), 0 0 0 0 rgba(0,229,199,0.4);
    position:relative; overflow:hidden;
    opacity: 0;
    animation: fadeUp 0.45s ease 1.15s both, btnPulse 2.8s ease-in-out 2.2s infinite;
  }
  @keyframes btnPulse {
    0%, 100% { box-shadow: 0 6px 20px rgba(13,148,136,0.35), 0 0 0 0 rgba(0,229,199,0.35); }
    50%       { box-shadow: 0 6px 20px rgba(13,148,136,0.35), 0 0 0 7px rgba(0,229,199,0); }
  }
  .btn::after {
    content:''; position:absolute; inset:0;
    background: linear-gradient(135deg, rgba(255,255,255,0.15), transparent);
    border-radius:inherit;
  }
  .btn:hover:not(:disabled) {
    opacity:0.93; transform:translateY(-2px);
    box-shadow: 0 10px 28px rgba(13,148,136,0.4);
  }
  .btn:active:not(:disabled) { transform:scale(0.98); }
  .btn:disabled { opacity:0.55; cursor:not-allowed; transform:none; box-shadow:none; animation: fadeUp 0.45s ease both; }

  .loader {
    display:none; text-align:center; margin-top:14px; color: var(--teal);
  }
  .loader-dots span {
    display:inline-block; width:6px; height:6px;
    background: var(--teal); border-radius:50%; margin:0 3px;
    animation: bounce 1.2s ease-in-out infinite;
  }
  .loader-dots span:nth-child(2) { animation-delay:0.2s; }
  .loader-dots span:nth-child(3) { animation-delay:0.4s; }
  @keyframes bounce {
    0%,80%,100% { transform:scale(0.6); opacity:0.4; }
    40%          { transform:scale(1);   opacity:1;   }
  }
  .loader p { margin-top:8px; font-size:12px; color: var(--muted); }

  .trust {
    display:flex; justify-content:center; gap:16px;
    margin-top:22px; flex-wrap:wrap;
    opacity: 0;
    animation: fadeUp 0.4s ease 1.3s both;
  }
  .badge {
    display:flex; align-items:center; gap:5px; font-size:11px; color: var(--muted);
    background: var(--teal-bg); padding: 5px 10px; border-radius: 999px;
    border: 1px solid rgba(13,148,136,0.12);
  }
  .badge-dot { width:5px; height:5px; background: var(--teal); border-radius:50%; opacity:0.6; }

  #overlay {
    display:none; position:fixed; inset:0;
    background: rgba(3, 16, 14, 0.5);
    backdrop-filter: blur(18px) saturate(1.3);
    -webkit-backdrop-filter: blur(18px) saturate(1.3);
    z-index:999; align-items:center; justify-content:center;
    padding:20px; overflow-y:auto;
    -webkit-overflow-scrolling: touch;
  }
  #overlay.show { display:flex; }

  .result-card {
    background: rgba(255,255,255,0.78);
    backdrop-filter: blur(28px) saturate(1.5);
    -webkit-backdrop-filter: blur(28px) saturate(1.5);
    border: 1px solid rgba(255,255,255,0.55);
    border-radius: 28px;
    padding: 32px 28px;
    width:100%; max-width:400px;
    text-align:center;
    box-shadow:
      0 2px 0 rgba(13,148,136,0.06),
      0 24px 80px rgba(8,32,29,0.22),
      inset 0 1px 0 rgba(255,255,255,0.8);
    animation: popIn 0.4s cubic-bezier(.22,.8,.35,1) both;
    max-height:90vh; overflow-y:auto;
  }
  @keyframes popIn {
    from { transform:scale(0.85) translateY(24px); opacity:0; }
    to   { transform:scale(1) translateY(0); opacity:1; }
  }

  .result-icon {
    width:56px; height:56px;
    background: var(--teal-bg);
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    margin: 0 auto 14px; font-size:26px;
  }
  .result-card h2 {
    font-family:'Space Grotesk', sans-serif;
    font-size:20px; font-weight:700; color: var(--dark); margin-bottom:5px;
  }
  .result-card > p {
    font-size:12px; color: var(--muted); margin-bottom:14px;
  }

  #finalReview {
    width:100%; height:140px;
    border-radius:14px; border:1.5px solid var(--border);
    background: rgba(240,253,251,0.8);
    padding:14px 16px; font-family:'DM Sans', sans-serif; font-size:13px;
    color: var(--dark); line-height:1.7; resize:none; outline:none;
    transition: border-color 0.2s; box-sizing:border-box;
  }
  #finalReview:focus { border-color: var(--teal); }

  .btn-copy {
    width:100%; padding:15px; margin-top:14px; border:none;
    border-radius:14px;
    background: linear-gradient(135deg, var(--teal), var(--teal-lt));
    color:white; font-family:'Space Grotesk', sans-serif; font-size:15px; font-weight:600;
    cursor:pointer; box-shadow: 0 6px 20px rgba(13,148,136,0.3);
    transition: opacity 0.2s, transform 0.15s;
  }
  .btn-copy:hover { opacity:0.92; transform:translateY(-1px); }
  .btn-copy:active { transform:scale(0.98); }

  .btn-close {
    display:block; width:100%; margin-top:10px; background:none; border:none;
    font-family:'DM Sans', sans-serif; font-size:13px; color:#9ab8b3; cursor:pointer; padding:6px;
    transition:color 0.15s;
  }
  .btn-close:hover { color: var(--muted); }

  #toast {
    display:none; position:fixed; bottom:28px; left:50%;
    transform: translateX(-50%);
    background: var(--dark); color:white;
    padding:11px 22px; border-radius:30px; font-size:13px;
    z-index:1000; white-space:normal; text-align:center;
    box-shadow: 0 8px 24px rgba(8,32,29,0.25);
    animation: toastIn 0.3s ease;
    max-width: calc(100vw - 32px);
  }
  @keyframes toastIn {
    from { opacity:0; transform: translateX(-50%) translateY(8px); }
    to   { opacity:1; transform: translateX(-50%) translateY(0); }
  }

  @media (max-width: 380px) {
    .card { padding:28px 20px 24px; border-radius:20px; }
    .header h1 { font-size:19px; }
    .star { font-size:36px; }
    .trust { gap:10px; }
    .float-emoji { display: none; }
  }

  /* confetti pieces */
  .confetti {
    position: fixed;
    width: 8px; height: 8px;
    border-radius: 2px;
    pointer-events: none;
    z-index: 9999;
    animation: confettiFall linear forwards;
  }
  @keyframes confettiFall {
    0%   { transform: translateY(-10px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
  }
</style>
</head>
<body>

<div class="circuit"></div>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<span class="float-emoji e1">📱</span>
<span class="float-emoji e2">🎧</span>
<span class="float-emoji e3">🔌</span>
<span class="float-emoji e4">🔋</span>
<span class="float-emoji e5">📶</span>
<span class="float-emoji e6">⌚</span>

<canvas id="starCanvas"></canvas>

<div class="wrap">
  <div class="card">
    <div class="header">
      <div style="position:relative; display:inline-block;">
        <span class="logo-ripple"></span>
        <img id="logoImg" class="logo-img" src="" alt="Jaydev Mobile logo" />
      </div>
      <div class="brand-name" id="brandName"></div>
      <h1 id="pageTitle"></h1>
      <p id="pageSubtitle"></p>
    </div>

    <div class="stars-block">
      <div class="stars" aria-label="5 star rating">
        <span class="star" id="s1">★</span>
        <span class="star" id="s2">★</span>
        <span class="star" id="s3">★</span>
        <span class="star" id="s4">★</span>
        <span class="star" id="s5">★</span>
      </div>
      <span class="stars-tag">
        <span class="signal-bars"><span></span><span></span><span></span><span></span></span>
        5.0 &nbsp;·&nbsp; Excellent
      </span>
    </div>

    <button id="btn" class="btn"></button>

    <div id="loader" class="loader">
      <div class="loader-dots"><span></span><span></span><span></span></div>
      <p id="loaderText"></p>
    </div>

    <div class="trust" id="trustBadges"></div>
  </div>
</div>

<div id="overlay">
  <div class="result-card">
    <div class="result-icon">🎉</div>
    <h2>Your Review is Ready!</h2>
    <p>Edit if you like, then copy &amp; post on Google</p>
    <textarea id="finalReview"></textarea>
    <button id="copyBtn" class="btn-copy">Copy &amp; Post on Google 🚀</button>
    <button class="btn-close" onclick="closeOverlay()">✕ Close</button>
  </div>
</div>

<div id="toast"></div>

<script>
/* ── APPLY BUSINESS CONFIG TO PAGE ── */
(function applyConfig() {
  const c = BUSINESS_CONFIG;

  const root = document.documentElement.style;
  root.setProperty('--teal',    c.theme.primary);
  root.setProperty('--teal-lt', c.theme.primaryLight);
  root.setProperty('--teal-bg', c.theme.primaryBg);
  root.setProperty('--gold',    c.theme.accent);

  document.title = c.businessName + ' — Review';

  document.getElementById('logoImg').src = LOGO_DATA_URI;
  document.getElementById('brandName').textContent  = c.businessName;
  document.getElementById('pageTitle').textContent  = c.pageTitle;
  document.getElementById('pageSubtitle').innerHTML = c.pageSubtitle;
  document.getElementById('btn').textContent         = c.buttonLabel;
  document.getElementById('loaderText').textContent  = c.loaderText;

  document.getElementById('trustBadges').innerHTML =
    c.badges.map(b =>
      '<div class="badge"><div class="badge-dot"></div>' + b + '</div>'
    ).join('');
})();
// wakes up backend after page load
setTimeout(() => {
  fetch(BUSINESS_CONFIG.backendUrl.replace('/review', '/'), { method: 'GET' })
    .catch(() => {});
}, 2000);

/* ── STAR TRAIL ── */
(function() {
  const canvas = document.getElementById('starCanvas');
  const ctx    = canvas.getContext('2d');
  let W, H;

  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  const particles = [];
  const GOLD = '#FFC107';

  function getStarPos(i) {
    const block = document.querySelector('.stars');
    if (!block) return null;
    const stars = block.querySelectorAll('.star');
    if (!stars[i]) return null;
    const r = stars[i].getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
  }

  function spawnTrail(starIdx) {
    const end = getStarPos(starIdx);
    if (!end) return;
    const start = { x: 0, y: 0 };
    const count = 18;
    for (let i = 0; i < count; i++) {
      const t = i / count;
      const x = start.x + (end.x - start.x) * t + (Math.random() - 0.5) * 22;
      const y = start.y + (end.y - start.y) * t + (Math.random() - 0.5) * 22;
      particles.push({
        x, y,
        vx: (Math.random() - 0.5) * 1.5,
        vy: (Math.random() - 0.5) * 1.5 - 0.4,
        life: 1,
        decay: 0.025 + Math.random() * 0.02,
        r: 1.5 + Math.random() * 2.5,
        glyph: Math.random() > 0.5
      });
    }
  }

  function burst(starIdx) {
    const pos = getStarPos(starIdx);
    if (!pos) return;
    for (let i = 0; i < 20; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 1.5 + Math.random() * 3;
      particles.push({
        x: pos.x, y: pos.y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 1,
        life: 1,
        decay: 0.03 + Math.random() * 0.02,
        r: 1 + Math.random() * 2,
        glyph: false
      });
    }
  }

  const delays = [1050, 1180, 1310, 1440, 1570];
  delays.forEach((d, i) => setTimeout(() => spawnTrail(i), d + 80));
  delays.forEach((d, i) => setTimeout(() => burst(i), d + 480));

  function draw() {
    ctx.clearRect(0, 0, W, H);
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x  += p.vx;
      p.y  += p.vy;
      p.vy += 0.04;
      p.life -= p.decay;
      if (p.life <= 0) { particles.splice(i, 1); continue; }

      ctx.globalAlpha = p.life * 0.85;
      if (p.glyph) {
        ctx.fillStyle = GOLD;
        ctx.font = `${p.r * 4}px serif`;
        ctx.fillText('★', p.x - p.r * 2, p.y + p.r * 2);
      } else {
        ctx.fillStyle = Math.random() > 0.4 ? GOLD : '#2DD4BF';
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(draw);
  }
  draw();

  delays.forEach((d, i) => {
    setTimeout(() => {
      const el = document.getElementById('s' + (i+1));
      if (el) el.classList.add('landed');
    }, d + 600);
  });
})();

/* ── FORM LOGIC ── */
function showToast(msg, duration = 3000) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.style.display = 'none', duration);
}

function closeOverlay() {
  document.getElementById('overlay').classList.remove('show');
}

document.getElementById('overlay').addEventListener('click', function(e) {
  if (e.target === this) closeOverlay();
});

document.getElementById('copyBtn').addEventListener('click', () => {
  const text = document.getElementById('finalReview').value.trim();
  if (!text) return;
  navigator.clipboard.writeText(text).then(() => {
    showToast('Copied! Opening Google Reviews... ✅');
    setTimeout(() => {
      window.open(BUSINESS_CONFIG.googleReviewUrl, '_blank');
    }, 800);
  }).catch(() => {
    document.getElementById('finalReview').select();
    showToast('Press Ctrl+C / Cmd+C to copy 📋');
  });
});

document.getElementById('btn').addEventListener('click', submitReview);

async function submitReview() {
  const btn    = document.getElementById('btn');
  const loader = document.getElementById('loader');

  btn.disabled         = true;
  loader.style.display = 'block';

  try {
    const res = await fetch(BUSINESS_CONFIG.backendUrl, {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({
        product:  BUSINESS_CONFIG.defaultProduct,
        rating:   '5',
        business: BUSINESS_CONFIG.businessName,
      }),
    });
    if (!res.ok) throw new Error('Error ' + res.status);

    // show overlay immediately with cursor
    document.getElementById('finalReview').value = '▋';
    document.getElementById('overlay').classList.add('show');
    launchConfetti();

    // stream text word by word
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let review = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      review += decoder.decode(value);
      document.getElementById('finalReview').value = review.replace(/^["']|["']$/g, '');
    }

    if (!review.trim()) throw new Error('Empty response');
  } catch (err) {
    console.error(err);
    showToast('Something went wrong. Please try again ❌', 4000);
  } finally {
    btn.disabled         = false;
    loader.style.display = 'none';
  }
}

/* ── CONFETTI BURST ── */
function launchConfetti() {
  const colors = ['#0D9488', '#FFC107', '#2DD4BF', '#4CAF50', '#00E5C7', '#F59E0B'];
  for (let i = 0; i < 60; i++) {
    const el = document.createElement('div');
    el.classList.add('confetti');
    el.style.left     = Math.random() * 100 + 'vw';
    el.style.top      = '-10px';
    el.style.background = colors[Math.floor(Math.random() * colors.length)];
    el.style.animationDuration = (1.5 + Math.random() * 2) + 's';
    el.style.animationDelay   = (Math.random() * 0.5) + 's';
    el.style.width  = (6 + Math.random() * 8) + 'px';
    el.style.height = (6 + Math.random() * 8) + 'px';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 4000);
  }
}
</script>
</body>
</html>
