<html>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --rose:    #E8445A;
    --rose-lt: #FF6B82;
    --rose-bg: #fff0f2;
    --gold:    #FFC107;
    --dark:    #1C0A10;
    --muted:   #9B7280;
    --surface: #ffffff;
    --border:  rgba(232,68,90,0.13);
  }

  body {
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    background: #fdf4f5;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    position: relative;
    overflow-x: hidden;
  }

  .orb {
    position: fixed;
    border-radius: 50%;
    pointer-events: none;
    z-index: 0;
    opacity: 0;
    animation: orbFadeIn 1.2s ease forwards;
  }
  .orb-1 {
    width: 420px; height: 420px;
    background: radial-gradient(circle, rgba(232,68,90,0.22), transparent 70%);
    top: -100px; right: -100px;
    animation-delay: 0.3s;
    animation-name: orbFadeIn, floatOrbOne;
    animation-duration: 1.2s, 10s;
    animation-delay: 0.3s, 1.5s;
    animation-timing-function: ease, ease-in-out;
    animation-fill-mode: forwards, none;
    animation-iteration-count: 1, infinite;
    animation-direction: normal, alternate;
    filter: blur(60px);
  }
  .orb-2 {
    width: 320px; height: 320px;
    background: radial-gradient(circle, rgba(255,193,7,0.18), transparent 70%);
    bottom: -80px; left: -80px;
    animation-delay: 0.6s;
    animation-name: orbFadeIn, floatOrbTwo;
    animation-duration: 1.2s, 14s;
    animation-delay: 0.6s, 1.8s;
    animation-timing-function: ease, ease-in-out;
    animation-fill-mode: forwards, none;
    animation-iteration-count: 1, infinite;
    animation-direction: normal, alternate;
    filter: blur(60px);
  }
  @keyframes orbFadeIn { to { opacity: 1; } }
  @keyframes floatOrbOne {
    0%   { transform: translate(0,0) scale(1); }
    50%  { transform: translate(-40px,50px) scale(1.15); }
    100% { transform: translate(10px,20px) scale(0.9); }
  }
  @keyframes floatOrbTwo {
    0%   { transform: translate(0,0) scale(1); }
    50%  { transform: translate(50px,-40px) scale(1.2); }
    100% { transform: translate(-20px,-20px) scale(0.95); }
  }

  #starCanvas {
    position: fixed;
    inset: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 40;
  }

  .wrap {
    width: 100%;
    max-width: 420px;
    position: relative;
    z-index: 1;
  }

  .card {
    background: var(--surface);
    border-radius: 28px;
    padding: 36px 32px 30px;
    box-shadow:
      0 2px 0 rgba(232,68,90,0.08),
      0 8px 32px rgba(28,10,16,0.09),
      0 32px 64px rgba(28,10,16,0.06);
    border: 1px solid var(--border);
    opacity: 0;
    transform: translateY(32px) scale(0.96);
    animation: cardIn 0.7s cubic-bezier(.22,.8,.35,1) 0.2s both;
  }
  @keyframes cardIn {
    to { opacity:1; transform: translateY(0) scale(1); }
  }

  .logo-wrap {
    display: inline-flex; align-items: center; justify-content: center;
    width: 72px; height: 72px;
    background: transparent;
    border-radius: 20px;
    margin-bottom: 14px;
    border: 1px solid rgba(232,68,90,0.15);
    opacity: 0;
    transform: translateY(-18px);
    animation: slideDown 0.55s cubic-bezier(.22,.8,.35,1) 0.5s both;
  }
  .logo-wrap img { width: 52px; object-fit: contain; }

  .header { text-align: center; margin-bottom: 20px; }
  .header h1 {
    font-family: 'Playfair Display', serif;
    font-size: 22px; font-weight: 600; color: var(--dark);
    line-height: 1.3; margin-bottom: 5px;
    opacity: 0; transform: translateY(12px);
    animation: fadeUp 0.5s ease 0.75s both;
  }
  .header p {
    font-size: 13px; color: var(--muted);
    opacity: 0;
    animation: fadeUp 0.5s ease 0.9s both;
  }

  @keyframes slideDown {
    to { opacity:1; transform: translateY(0); }
  }
  @keyframes fadeUp {
    to { opacity:1; transform: translateY(0); }
  }

  .stars-block {
    text-align: center;
    margin: 16px 0 20px;
    opacity: 0;
    animation: fadeUp 0.5s ease 1.0s both;
  }
  .stars {
    display: flex;
    justify-content: center;
    gap: 4px;
    margin-bottom: 8px;
    position: relative;
  }

  .star {
    font-size: 44px;
    color: var(--gold);
    user-select: none;
    line-height: 1;
    filter: drop-shadow(0 2px 6px rgba(255,193,7,0.5));
    opacity: 0;
    transform: translate(-140px, -140px) rotate(-40deg) scale(0.4);
    animation: starShoot 0.55s cubic-bezier(.22,.8,.35,1) both;
    display: inline-block;
  }
  .star:nth-child(1) { animation-delay: 1.05s; }
  .star:nth-child(2) { animation-delay: 1.18s; }
  .star:nth-child(3) { animation-delay: 1.31s; }
  .star:nth-child(4) { animation-delay: 1.44s; }
  .star:nth-child(5) { animation-delay: 1.57s; }

  @keyframes starShoot {
    0%   { opacity: 0; transform: translate(-140px, -140px) rotate(-40deg) scale(0.4); }
    60%  { opacity: 1; transform: translate(4px, -6px) rotate(6deg) scale(1.15); }
    80%  { transform: translate(-3px, 3px) rotate(-4deg) scale(0.96); }
    100% { opacity: 1; transform: translate(0,0) rotate(0deg) scale(1); }
  }

  .star.landed {
    animation: starShoot 0.55s cubic-bezier(.22,.8,.35,1) both, starShimmer 2.4s ease-in-out 1.8s infinite;
  }
  @keyframes starShimmer {
    0%, 100% { filter: drop-shadow(0 2px 6px rgba(255,193,7,0.5)); transform: scale(1); }
    50%       { filter: drop-shadow(0 4px 14px rgba(255,193,7,0.85)); transform: scale(1.08); }
  }

  .stars-tag {
    display: inline-block;
    background: var(--rose-bg);
    color: var(--rose);
    font-size: 11px; font-weight: 500;
    padding: 3px 12px;
    border-radius: 20px;
    letter-spacing: 0.04em;
    opacity: 0;
    animation: fadeUp 0.4s ease 1.9s both;
  }

  .divider {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 16px;
    opacity: 0;
    animation: fadeUp 0.4s ease 1.1s both;
  }
  .divider::before, .divider::after {
    content:''; flex:1; height:1px; background: var(--border);
  }
  .divider span {
    font-size: 15px; color: black;
    letter-spacing: 0.08em; text-transform: uppercase; font-weight: 700;
  }

  .select-wrap {
    position: relative; margin-bottom: 12px; width: 100%;
    opacity: 0;
    animation: fadeUp 0.45s ease 1.2s both;
  }
  .select-wrap::after {
    content:'▾'; position:absolute; right:22px; top:50%;
    transform: translateY(-50%);
    color: var(--rose); font-size: 30px; pointer-events:none;
  }
  select {
    width:100%; min-width:0; height:52px;
    padding: 0 44px 0 16px;
    border-radius: 14px;
    border: 1.5px solid var(--border);
    background: #fdf8f9;
    font-family: inherit; font-size:14px; color: var(--dark);
    outline:none; appearance:none; -webkit-appearance:none; cursor:pointer;
  }
  select:focus {
    border-color: var(--rose);
    box-shadow: 0 0 0 3px rgba(232,68,90,0.1);
  }

  #otherInput {
    display:none; width:100%;
    padding: 13px 16px; border-radius:14px;
    border: 1.5px solid var(--rose); background:#fdf8f9;
    font-family:inherit; font-size:14px; color: var(--dark);
    outline:none; margin-bottom:12px;
    box-shadow: 0 0 0 3px rgba(232,68,90,0.08);
    height:52px; box-sizing:border-box;
  }
  #otherInput::placeholder { color:#c0a0a8; }
  #otherInput:focus {
    border-color: var(--rose);
    box-shadow: 0 0 0 4px rgba(232,68,90,0.12);
  }

  .btn {
    width:100%; padding:16px; margin-top:4px;
    border:none; border-radius:16px;
    background: linear-gradient(135deg, var(--rose) 0%, var(--rose-lt) 100%);
    color:white; font-family:inherit; font-size:15px; font-weight:500;
    cursor:pointer; letter-spacing:0.02em;
    transition: opacity 0.2s, transform 0.15s, box-shadow 0.2s;
    box-shadow: 0 6px 20px rgba(232,68,90,0.35);
    position:relative; overflow:hidden;
    opacity: 0;
    animation: fadeUp 0.45s ease 1.3s both;
  }
  .btn::after {
    content:''; position:absolute; inset:0;
    background: linear-gradient(135deg, rgba(255,255,255,0.15), transparent);
    border-radius:inherit;
  }
  .btn:hover:not(:disabled) {
    opacity:0.93; transform:translateY(-2px);
    box-shadow: 0 10px 28px rgba(232,68,90,0.4);
  }
  .btn:active:not(:disabled) { transform:scale(0.98); }
  .btn:disabled { opacity:0.55; cursor:not-allowed; transform:none; box-shadow:none; }

  .loader {
    display:none; text-align:center; margin-top:14px; color: var(--rose);
  }
  .loader-dots span {
    display:inline-block; width:6px; height:6px;
    background: var(--rose); border-radius:50%; margin:0 3px;
    animation: bounce 1.2s ease-in-out infinite;
  }
  .loader-dots span:nth-child(2) { animation-delay:0.2s; }
  .loader-dots span:nth-child(3) { animation-delay:0.4s; }
  @keyframes bounce {
    0%,80%,100% { transform:scale(0.6); opacity:0.4; }
    40%          { transform:scale(1);   opacity:1;   }
  }
  .loader p { margin-top:8px; font-size:12px; color: var(--muted); }

  .trust {
    display:flex; justify-content:center; gap:18px;
    margin-top:20px; flex-wrap:wrap;
    opacity: 0;
    animation: fadeUp 0.4s ease 1.45s both;
  }
  .badge { display:flex; align-items:center; gap:5px; font-size:11px; color: var(--muted); }
  .badge-dot { width:5px; height:5px; background: var(--rose); border-radius:50%; opacity:0.45; }

  #overlay {
    display:none; position:fixed; inset:0;
    background: rgba(20, 4, 10, 0.45);
    backdrop-filter: blur(18px) saturate(1.3);
    -webkit-backdrop-filter: blur(18px) saturate(1.3);
    z-index:999; align-items:center; justify-content:center;
    padding:20px; overflow-y:auto;
    -webkit-overflow-scrolling: touch;
  }
  #overlay.show { display:flex; }

  .result-card {
    background: rgba(255,255,255,0.72);
    backdrop-filter: blur(28px) saturate(1.5);
    -webkit-backdrop-filter: blur(28px) saturate(1.5);
    border: 1px solid rgba(255,255,255,0.55);
    border-radius: 28px;
    padding: 32px 28px;
    width:100%; max-width:400px;
    text-align:center;
    box-shadow:
      0 2px 0 rgba(232,68,90,0.06),
      0 24px 80px rgba(28,10,16,0.22),
      inset 0 1px 0 rgba(255,255,255,0.8);
    animation: popIn 0.4s cubic-bezier(.22,.8,.35,1) both;
    max-height:90vh; overflow-y:auto;
  }
  @keyframes popIn {
    from { transform:scale(0.85) translateY(24px); opacity:0; }
    to   { transform:scale(1) translateY(0); opacity:1; }
  }

  .result-icon {
    width:56px; height:56px;
    background: var(--rose-bg);
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    margin: 0 auto 14px; font-size:26px;
  }
  .result-card h2 {
    font-family:'Playfair Display',serif;
    font-size:20px; font-weight:600; color: var(--dark); margin-bottom:5px;
  }
  .result-card > p {
    font-size:12px; color: var(--muted); margin-bottom:14px;
  }

  #finalReview {
    width:100%; height:140px;
    border-radius:14px; border:1.5px solid var(--border);
    background: rgba(253,248,249,0.8);
    padding:14px 16px; font-family:inherit; font-size:13px;
    color: var(--dark); line-height:1.7; resize:none; outline:none;
    transition: border-color 0.2s; box-sizing:border-box;
  }
  #finalReview:focus { border-color: var(--rose); }

  .btn-copy {
    width:100%; padding:15px; margin-top:14px; border:none;
    border-radius:14px;
    background: linear-gradient(135deg, var(--rose), var(--rose-lt));
    color:white; font-family:inherit; font-size:15px; font-weight:500;
    cursor:pointer; box-shadow: 0 6px 20px rgba(232,68,90,0.3);
    transition: opacity 0.2s, transform 0.15s;
  }
  .btn-copy:hover { opacity:0.92; transform:translateY(-1px); }
  .btn-copy:active { transform:scale(0.98); }

  .btn-close {
    display:block; width:100%; margin-top:10px; background:none; border:none;
    font-family:inherit; font-size:13px; color:#c0a0a8; cursor:pointer; padding:6px;
    transition:color 0.15s;
  }
  .btn-close:hover { color: var(--muted); }

  #toast {
    display:none; position:fixed; bottom:28px; left:50%;
    transform: translateX(-50%);
    background: var(--dark); color:white;
    padding:11px 22px; border-radius:30px; font-size:13px;
    z-index:1000; white-space:normal; text-align:center;
    box-shadow: 0 8px 24px rgba(28,10,16,0.25);
    animation: toastIn 0.3s ease;
    max-width: calc(100vw - 32px);
  }
  @keyframes toastIn {
    from { opacity:0; transform: translateX(-50%) translateY(8px); }
    to   { opacity:1; transform: translateX(-50%) translateY(0); }
  }

  @media (max-width: 380px) {
    .card { padding:28px 20px 24px; border-radius:20px; }
    .header h1 { font-size:19px; }
    .star { font-size:36px; }
    select { font-size:13px; padding: 0 40px 0 14px; }
    .trust { gap:10px; }
  }


  /* confetti pieces */
  .confetti {
    position: fixed;
    width: 8px; height: 8px;
    border-radius: 2px;
    pointer-events: none;
    z-index: 9999;
    animation: confettiFall linear forwards;
  }
  @keyframes confettiFall {
    0%   { transform: translateY(-10px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
  }
</style>
</head>

<script>
/* ── APPLY BUSINESS CONFIG TO PAGE ── */
(function applyConfig() {
  const c = BUSINESS_CONFIG;

  const root = document.documentElement.style;
  root.setProperty('--rose',    c.theme.primary);
  root.setProperty('--rose-lt', c.theme.primaryLight);
  root.setProperty('--rose-bg', c.theme.primaryBg);
  root.setProperty('--gold',    c.theme.accent);

  document.title = c.businessName + ' — Review';

  const logo = document.getElementById('logoImg');
  logo.src = c.logoUrl;
  logo.alt = c.businessName;

  document.getElementById('pageTitle').textContent  = c.pageTitle;
  document.getElementById('pageSubtitle').innerHTML = c.pageSubtitle;
  document.getElementById('dividerLabel').textContent = c.dividerLabel;
  document.getElementById('btn').textContent         = c.buttonLabel;
  document.getElementById('loaderText').textContent  = c.loaderText;
  document.getElementById('otherInput').placeholder  = c.otherPlaceholder;

  const sel = document.getElementById('productSelect');
  sel.innerHTML =
    '<option value="">' + c.dropdownPlaceholder + '</option>' +
    c.products.map(p =>
      '<option value="' + p.value + '">' + p.label + '</option>'
    ).join('');

  document.getElementById('trustBadges').innerHTML =
    c.badges.map(b =>
      '<div class="badge"><div class="badge-dot"></div>' + b + '</div>'
    ).join('');
})();
// wakes up backend after page load
setTimeout(() => {
  fetch(BUSINESS_CONFIG.backendUrl.replace('/review', '/'), { method: 'GET' })
    .catch(() => {});
}, 2000);
         
/* ── STAR TRAIL ── */
(function() {
  const canvas = document.getElementById('starCanvas');
  const ctx    = canvas.getContext('2d');
  let W, H;

  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  const particles = [];
  const GOLD = '#FFC107';

  function getStarPos(i) {
    const block = document.querySelector('.stars');
    if (!block) return null;
    const stars = block.querySelectorAll('.star');
    if (!stars[i]) return null;
    const r = stars[i].getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
  }

  function spawnTrail(starIdx) {
    const end = getStarPos(starIdx);
    if (!end) return;
    const start = { x: 0, y: 0 };
    const count = 18;
    for (let i = 0; i < count; i++) {
      const t = i / count;
      const x = start.x + (end.x - start.x) * t + (Math.random() - 0.5) * 22;
      const y = start.y + (end.y - start.y) * t + (Math.random() - 0.5) * 22;
      particles.push({
        x, y,
        vx: (Math.random() - 0.5) * 1.5,
        vy: (Math.random() - 0.5) * 1.5 - 0.4,
        life: 1,
        decay: 0.025 + Math.random() * 0.02,
        r: 1.5 + Math.random() * 2.5,
        glyph: Math.random() > 0.5
      });
    }
  }

  function burst(starIdx) {
    const pos = getStarPos(starIdx);
    if (!pos) return;
    for (let i = 0; i < 20; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 1.5 + Math.random() * 3;
      particles.push({
        x: pos.x, y: pos.y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 1,
        life: 1,
        decay: 0.03 + Math.random() * 0.02,
        r: 1 + Math.random() * 2,
        glyph: false
      });
    }
  }

  const delays = [1050, 1180, 1310, 1440, 1570];
  delays.forEach((d, i) => setTimeout(() => spawnTrail(i), d + 80));
  delays.forEach((d, i) => setTimeout(() => burst(i), d + 480));

  function draw() {
    ctx.clearRect(0, 0, W, H);
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x  += p.vx;
      p.y  += p.vy;
      p.vy += 0.04;
      p.life -= p.decay;
      if (p.life <= 0) { particles.splice(i, 1); continue; }

      ctx.globalAlpha = p.life * 0.85;
      if (p.glyph) {
        ctx.fillStyle = GOLD;
        ctx.font = `${p.r * 4}px serif`;
        ctx.fillText('★', p.x - p.r * 2, p.y + p.r * 2);
      } else {
        ctx.fillStyle = Math.random() > 0.4 ? GOLD : '#FF6B82';
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(draw);
  }
  draw();

  delays.forEach((d, i) => {
    setTimeout(() => {
      const el = document.getElementById('s' + (i+1));
      if (el) el.classList.add('landed');
    }, d + 600);
  });
})();

/* ── FORM LOGIC ── */
function handleProductChange(val) {
  const o = document.getElementById('otherInput');
  if (val === 'Other') {
    o.style.display = 'block';
    setTimeout(() => o.focus(), 50);
  } else {
    o.style.display = 'none';
    o.value = '';
  }
}

function showToast(msg, duration = 3000) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.style.display = 'none', duration);
}

function closeOverlay() {
  document.getElementById('overlay').classList.remove('show');
}

document.getElementById('overlay').addEventListener('click', function(e) {
  if (e.target === this) closeOverlay();
});

document.getElementById('copyBtn').addEventListener('click', () => {
  const text = document.getElementById('finalReview').value.trim();
  if (!text) return;
  navigator.clipboard.writeText(text).then(() => {
    showToast('Copied! Opening Google Reviews... ✅');
    setTimeout(() => {
      window.open(BUSINESS_CONFIG.googleReviewUrl, '_blank');
    }, 800);
  }).catch(() => {
    document.getElementById('finalReview').select();
    showToast('Press Ctrl+C / Cmd+C to copy 📋');
  });
});

document.getElementById('btn').addEventListener('click', submitReview);

async function submitReview() {
  const select     = document.getElementById('productSelect');
  const otherInput = document.getElementById('otherInput');
  const btn        = document.getElementById('btn');
  const loader     = document.getElementById('loader');

  let product = select.value;

  if (!product) {
    showToast('Please select your invitation type 📝');
    return;
  }
  if (product === 'Other') {
    const custom = otherInput.value.trim();
    if (!custom) {
      showToast('Please tell us what we made for you ✏️');
      otherInput.focus();
      return;
    }
    product = custom;
  }

  btn.disabled         = true;
  loader.style.display = 'block';

try {
    const res = await fetch(BUSINESS_CONFIG.backendUrl, {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({
        product,
        rating:   '5',
        business: BUSINESS_CONFIG.businessName,
      }),
    });
    if (!res.ok) throw new Error('Error ' + res.status);

// show overlay immediately with cursor
document.getElementById('finalReview').value = '▋';
document.getElementById('overlay').classList.add('show');
launchConfetti();
    // stream text word by word
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let review = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      review += decoder.decode(value);
      document.getElementById('finalReview').value = review.replace(/^["']|["']$/g, '');
    }

    if (!review.trim()) throw new Error('Empty response');
  } catch (err) {
    console.error(err);
    showToast('Something went wrong. Please try again ❌', 4000);
  } finally {
    btn.disabled         = false;
    loader.style.display = 'none';
  }
}


/* ── CONFETTI BURST ── */
function launchConfetti() {
  const colors = ['#E8445A', '#FFC107', '#FF6B82', '#4CAF50', '#2196F3', '#9C27B0'];
  for (let i = 0; i < 60; i++) {
    const el = document.createElement('div');
    el.classList.add('confetti');
    el.style.left     = Math.random() * 100 + 'vw';
    el.style.top      = '-10px';
    el.style.background = colors[Math.floor(Math.random() * colors.length)];
    el.style.animationDuration = (1.5 + Math.random() * 2) + 's';
    el.style.animationDelay   = (Math.random() * 0.5) + 's';
    el.style.width  = (6 + Math.random() * 8) + 'px';
    el.style.height = (6 + Math.random() * 8) + 'px';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 4000);
  }
}
